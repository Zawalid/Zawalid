name: Refresh profile numbers

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the live images
        run: node scripts/build.mjs live
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh live profile numbers"
          git pull --rebase origin main
          git push
